version: "2"
linters:
  default: none
  enable:
    - gosec
    - errorlint
    - bodyclose
  settings:
    gosec:
      excludes:
        - G404
        - G115
        - G401
        - G501
        - G505
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - bodyclose
          - errorlint
      - path: examples/
        linters:
          - gosec
          - bodyclose
          - errorlint
