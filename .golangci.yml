version: "2"
linters:
  default: none
  enable:
    - gosec
    - errorlint
    - bodyclose
    - contextcheck
    - noctx
  settings:
    gosec:
      excludes:
        - G404
        - G115
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
      - path: examples/
        linters:
          - gosec
